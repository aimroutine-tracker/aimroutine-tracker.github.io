name: One-time server-side password length probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-password-policy.yml"
permissions:
  contents: read
jobs:
  auth-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attempt 11-character password through direct Auth API
        run: node tests/one-time-password-policy.mjs
