name: Archived Pages recovery — no deployments
# This old one-time recovery workflow previously exposed a second, uncontrolled
# deployment path. It is retired for V3. Publication is handled exclusively by
# publish-pages.yml, under explicit owner review and opt-in.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Explain protected publication route
        run: |
          echo "Archived: no Pages cancellation, upload or deployment will occur."
          echo "For an approved release use Publish verified public site on main."
          echo "Never publish while original-PNG QA or real-account tests are pending."
