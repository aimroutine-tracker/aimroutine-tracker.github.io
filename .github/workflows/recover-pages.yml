name: Recover stalled Pages deployment and publish site

on:
  push:
    paths:
      - .github/workflows/recover-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aimroutine-pages-recovery
  cancel-in-progress: false

jobs:
  clear-stale-pages-deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Cancel the specific stale Pages deployment reported by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Stale deployment SHA from Pages error logs, not the latest commit.
          STALE_SHA="d51d6ee9dce168c4108d5db656d6eec0bb401369"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_SHA}/cancel"
          HTTP_CODE="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            -o /tmp/pages-cancel-response.json -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" "$API")"
          echo "Cancellation status: ${HTTP_CODE}"
          if [[ "$HTTP_CODE" == "204" || "$HTTP_CODE" == "404" ]]; then
            echo "Known stalled deployment cancelled or already absent."
          else
            cat /tmp/pages-cancel-response.json
            echo "::error::Pages API refused the targeted cancellation."
            exit 1
          fi

  publish:
    needs: clear-stale-pages-deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy latest site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
