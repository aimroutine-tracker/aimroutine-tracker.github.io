name: One-time verify eight-character Supabase Auth policy
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-password8-once.yml"
permissions:
  contents: read
jobs:
  password-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live Supabase eight-character minimum and beta signup gate
        run: node tests/verify-password8-once.mjs
