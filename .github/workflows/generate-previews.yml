name: Generate compressed application screenshot previews
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-previews.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Generate size-limited previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          for name in ['aimroutine-29-dashboard','aimroutine-29-coach']:
              source=Path(f'{name}.webp')
              output=Path(f'{name}-preview.webp')
              with Image.open(source) as img:
                  img=ImageOps.exif_transpose(img).convert('RGB')
                  img.thumbnail((1100,780),Image.Resampling.LANCZOS)
                  img.save(output,format='WEBP',quality=77,method=6)
              print(f'{source}: {source.stat().st_size} bytes; {output}: {output.stat().st_size} bytes')
              if output.stat().st_size>source.stat().st_size:
                  raise RuntimeError('Image preview grew instead of shrinking')
          PY
      - name: Commit optimized preview assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aimroutine-29-dashboard-preview.webp aimroutine-29-coach-preview.webp
          if git diff --cached --quiet; then
            echo 'Previews already up to date.'
          else
            git commit -m "Add lighter WebP previews for Windows app screenshots"
            git push
          fi
