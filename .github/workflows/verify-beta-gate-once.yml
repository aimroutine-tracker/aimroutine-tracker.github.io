name: One-time verify activated email signup gate
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-beta-gate-once.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/verify-beta-gate-once.mjs
