name: Site quality checks
on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.mjs"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/site-quality.yml"
  # Every pull request must run this required check, including docs-only changes.
  # Path-filtered required checks can remain pending and block the merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aimroutine-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          for script in *.js *.mjs; do node --check "$script"; done
      - name: Test training logic
        run: node --test tests/*core.test.mjs tests/site-interface-v19.test.mjs tests/site-reference-v20.test.mjs tests/site-reference-v21.test.mjs
      - name: Prevent accidental secret commits
        run: python3 tests/check_secrets.py
      - name: Validate internal HTML links and assets
        run: python3 tests/check_site.py
      - name: Verify minimal public artifact
        run: |
          python3 scripts/build_public.py
          python3 tests/check_public_artifact.py
