name: Lighthouse audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "training.html"
      - "progress.html"
      - "account.html"
      - "site-*.css"
      - "site-*.js"
      - "site-*.mjs"
      - "progress-v14.mjs"
      - "training*.css"
      - "training*.mjs"
      - ".github/workflows/lighthouse-audit.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lighthouse-audit.yml"
      - "index.html"
      - "training.html"
      - "account.html"
      - "aimroutine-v16.css"
      - "training*.js"
      - "training*.mjs"
      - "training*.css"
permissions:
  contents: read

# Ignore superseded commits: only the current PR/head build matters.
concurrency:
  group: aimroutine-lighthouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Lighthouse
        run: npm install --no-save lighthouse@13.6.0
      - name: Start local website
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aimroutine-lh-http.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8765/account.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/aimroutine-lh-http.log
          exit 1
      - name: Diagnose third-party image CDN availability (nonblocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8f0df8efd5b986039cd37a4d5f3bf31b815d0c54-3840x2160.jpg"
          for suffix in "" "?w=800&q=70&auto=format"; do
            curl --fail --silent --show-error --location --max-time 25 -o /tmp/ar-cdn-image -w "image HTTP=%{http_code} bytes=%{size_download} type=%{content_type}\n" "${BASE}${suffix}"
          done
      - name: Audit home, training, progress and account pages
        run: |
          set -euo pipefail
          mkdir -p lh-reports
          for page in index training progress account; do
            passed=0
            for attempt in 1 2; do
              echo "Lighthouse $page attempt $attempt/2"
              if npx lighthouse "http://127.0.0.1:8765/$page.html" \
                --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run" \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json --output=html --output-path="lh-reports/$page" --quiet \
                2>"/tmp/lh-$page.log"; then
                passed=1
                break
              fi
              cat "/tmp/lh-$page.log"
              if [ "$attempt" -lt 2 ]; then
                echo "::warning::Lighthouse failed to launch/audit $page; retrying once"
                sleep 5
              fi
            done
            if [ "$passed" -ne 1 ]; then
              echo "::error::Lighthouse could not audit $page after two attempts"
              exit 1
            fi
            test -s "lh-reports/$page.report.json"
            test -s "lh-reports/$page.report.html"
          done
      - name: Summarize Lighthouse scores
        run: |
          node --input-type=module <<'NODE' | tee lighthouse-summary.md
          import {readdirSync,readFileSync} from 'node:fs';
          const files=readdirSync('lh-reports').filter(f=>f.endsWith('.report.json')).sort();
          if(files.length!==4)throw Error('Expected 4 Lighthouse reports, got '+files.length);
          console.log('## Lighthouse — local representative pages');
          console.log('| Page | Performance | Accessibility | Best practices | SEO |');
          console.log('|---|---:|---:|---:|---:|');
          for(const file of files){
            const r=JSON.parse(readFileSync('lh-reports/'+file,'utf8'));
            const score=id=>Math.round(100*(r.categories[id]?.score??0));
            console.log('| '+file.replace('.report.json','')+' | '+score('performance')+' | '+score('accessibility')+' | '+score('best-practices')+' | '+score('seo')+' |');
          }
          console.log('');
          console.log('### Performance diagnostics');
          for(const file of files){
            const r=JSON.parse(readFileSync('lh-reports/'+file,'utf8'));
            console.log('\n#### '+file.replace('.report.json',''));
            for(const key of ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','server-response-time','render-blocking-requests','unused-css-rules','unused-javascript','total-byte-weight']){
              const a=r.audits[key];
              if(!a)continue;
              console.log('- '+key+': '+(a.displayValue||('score='+a.score)));
              if(['render-blocking-requests','unused-css-rules','unused-javascript'].includes(key)&&a.details?.items){
                for(const item of a.details.items.slice(0,5))console.log('  - '+String(item.url||item.source?.url||item.node?.snippet||'').slice(0,160)+'; savings='+(item.wastedMs??item.wastedBytes??0));
              }
            }
            const network=(r.audits['network-requests']?.details?.items||[])
              .filter(x=>x.transferSize>0).sort((a,b)=>b.transferSize-a.transferSize).slice(0,10);
            console.log('Largest requests:');
            for(const x of network)console.log('  - '+String(x.url||'').slice(0,185)+' ('+Math.round((x.transferSize||0)/1024)+' KB)');
          }
          NODE
          cat lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-aimroutine-reports
          path: |
            lh-reports/
            lighthouse-summary.md
          if-no-files-found: warn
