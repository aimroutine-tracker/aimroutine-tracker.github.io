name: One-time Outlook Supabase email delivery check
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/outlook-delivery-once.yml"
permissions:
  contents: read
jobs:
  smtp-outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/outlook-delivery-once.mjs
