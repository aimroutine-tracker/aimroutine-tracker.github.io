name: Fast Auth UI regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/auth-ui-quick.yml"
      - "tests/browser.spec.mjs"
      - "account.html"
      - "account-v7.mjs"
      - "username-v7.mjs"
      - "cloud-sync-v7.mjs"
      - "supabase/migrations/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-ui-quick.yml"
      - "tests/browser.spec.mjs"
      - "account-v7.mjs"
      - "cloud-sync-v7.mjs"
      - "cloud-core-v7.mjs"
      - "supabase/migrations/**"
permissions:
  contents: read
jobs:
  auth-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright and Chromium only
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium
      - name: Start static site locally
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/aimroutine-auth-ui.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8765/account.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/aimroutine-auth-ui.log
          exit 1
      - name: Validate all desktop Chromium scenarios including mocked account deletion and recovery
        run: npx playwright test --config=tests/playwright.config.mjs --project=chromium-desktop
