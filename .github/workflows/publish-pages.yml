name: Publish verified public site
# V3 release freeze: merging a draft PR must never trigger automatic deployment.
# A human operator must attest that the four private owner PNG comparisons,
# disposable-account auth/sync tests and visual approval are complete.
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: 'Type PUBLIER_AIMROUTINE_V3 after completing all release checks'
        required: true
        type: string
      four_originals_reviewed:
        description: 'Four verified original PNG comparisons and human visual review complete'
        required: true
        type: boolean
        default: false
      disposable_accounts_verified:
        description: 'Email, Google and multi-device sync tested with disposable accounts'
        required: true
        type: boolean
        default: false
      account_bound_reset_verified:
        description: 'Account-bound reset RPC deployed and A/B race test passed'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aimroutine-pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    # Only a manually approved dispatch FROM MAIN can deploy.
    # GitHub Pages' environment may impose additional review protections.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.release_confirmation == 'PUBLIER_AIMROUTINE_V3' &&
      inputs.four_originals_reviewed == true &&
      inputs.disposable_accounts_verified == true &&
      inputs.account_bound_reset_verified == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned test runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gate deployment on code, sync and security tests
        run: |
          for script in *.js *.mjs; do node --check "$script"; done
          node --test tests/*core.test.mjs
          python3 -m unittest discover -s tests -p 'test_stage_public_visual_evidence_v3.py' -v
          python3 -m unittest discover -s tests -p 'test_private_source_fidelity_gate_v3.py' -v
          python3 tests/check_secrets.py
          python3 scripts/check_reset_release_ready.py
      - name: Prepare public-only artifact
        run: python3 scripts/build_public.py
      - name: Verify artifact and prevent accidental secret publication
        run: python3 tests/check_public_artifact.py
      - name: Validate site asset links
        run: python3 tests/check_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: .public-site
          # Each rerun creates an independent artifact; avoid multiple matching copies.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Allow artifact metadata to propagate
        run: sleep 12
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
