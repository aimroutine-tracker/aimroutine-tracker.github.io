name: Publish verified public site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aimroutine-pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public-only artifact
        run: python3 scripts/build_public.py
      - name: Verify artifact and prevent accidental secret publication
        run: python3 tests/check_public_artifact.py
      - name: Validate site asset links
        run: python3 tests/check_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: .public-site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
