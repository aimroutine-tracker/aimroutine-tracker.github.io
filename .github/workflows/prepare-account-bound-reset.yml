name: Validate account-bound reset migration (isolated PostgreSQL)
# CI has no Supabase production token. This workflow uses a temporary Postgres
# container, synthetic users, and the committed SQL migration only.
on:
  pull_request:
    paths:
      - ".github/workflows/prepare-account-bound-reset.yml"
      - "supabase/migrations/**"
      - "cloud-sync-v7.mjs"
      - "scripts/check_reset_release_ready.py"
      - "tests/account-bound-reset-postgres.sql"
      - "tests/atomic-reset-guard-prototype-postgres.sql"
      - "tests/atomic-v3-cloud-patch-postgres.sql"
      - "tests/test_atomic_v3_patch_concurrency.sh"
      - "tests/test_atomic_reset_concurrency.sh"
      - "scripts/check_live_reset_readiness_v3.sql"
      - "tests/cloud-sync-integration-core.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: qa_only_ephemeral_password
          POSTGRES_DB: aimroutine_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aimroutine_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: qa_only_ephemeral_password
      PGDATABASE: aimroutine_qa
    steps:
      - uses: actions/checkout@v4
      - name: Check source and migration contract
        run: python3 scripts/check_reset_release_ready.py
      - name: Validate expected owner / JWT A-B isolation using ephemeral database
        run: |
          set -euo pipefail
          psql --version
          psql -v ON_ERROR_STOP=1 -f tests/account-bound-reset-postgres.sql
      - name: Prove version-gated write prototype on isolated PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/atomic-reset-guard-prototype-postgres.sql
      - name: Verify both real transaction interleavings in two SQL connections
        run: bash tests/test_atomic_reset_concurrency.sh
      - name: Exercise V3 all-table atomic Cloud patch contract
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/atomic-v3-cloud-patch-postgres.sql
      - name: Check parallel reset races against actual V3 all-table RPC
        run: bash tests/test_atomic_v3_patch_concurrency.sh
      - name: Validate hosted preflight using the migrated isolated database
        run: |
          set -euo pipefail
          report=$(psql -X -q -t -A -v ON_ERROR_STOP=1 -f scripts/check_live_reset_readiness_v3.sql)
          python3 -c '
          import json,sys
          report=json.loads(sys.argv[1])
          required=("ready_for_private_qa","rpc_installed","rpc_security_invoker",
                    "rpc_anon_denied","rpc_authenticated_execute",
                    "rpc_owner_guard_present","four_owner_only_tables",
                    "write_rpc_installed","write_rpc_security_invoker",
                    "write_rpc_anon_denied","write_rpc_authenticated_execute",
                    "write_rpc_owner_epoch_guard")
          failed=[key for key in required if report.get(key) is not True]
          if failed:
              raise SystemExit("Isolated migrated database did not satisfy readiness: "+", ".join(failed))
          print("PASS: catalog-only reset readiness checks against migrated synthetic DB.")
          ' "$report"
