name: Supabase public security smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-public-security.yml"
      - "tests/supabase-public-security.mjs"
      - "supabase/migrations/**"
      - "cloud-sync-v7.mjs"
  pull_request:
    paths:
      - ".github/workflows/supabase-public-security.yml"
      - "tests/supabase-public-security.mjs"
      - "supabase/migrations/**"
      - "cloud-sync-v7.mjs"
      - "cloud-client-v7.mjs"
permissions:
  contents: read
jobs:
  public-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public Auth configuration and reject anonymous account deletion
        run: node tests/supabase-public-security.mjs
